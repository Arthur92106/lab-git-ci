# Nom de ton pipeline
name: CI

# Déclencheurs (triggers) : quand le pipeline s'exécute
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Liste des jobs à exécuter
jobs:
  build:
    # L'ordinateur qui va faire le travail (ici un Linux)
    runs-on: ubuntu-latest

    # Les étapes (steps) à automatiser
    steps:
      # 1. Récupérer le code de ton dépôt
      - uses: actions/checkout@v4

      # 2. Une commande simple pour tester
      - name: Run a one-line script
        run: echo "Hello, GitHub Actions!"

      # 3. Une commande multi-lignes
      - name: Run a multi-line script
        run: |
          echo "Le pipeline s'exécute..."
          echo "Test de construction réussi."
